# Run the app locally with:  docker compose up --build
# App will be at http://localhost:8000
#
# No MySQL container: the app connects to the MySQL already running on this PC.
# Credentials come from the `.env` file next to this one (copy .env.example).
#
# One caveat: inside a container `127.0.0.1` means the container itself, not
# your PC — so DB_HOST is overridden below to `host.docker.internal`, which
# Docker maps to the host machine. Everything else in .env is used as-is.
#
# Your host MySQL must also accept the connection:
#   • bind-address = 0.0.0.0  (not 127.0.0.1) in my.ini, then restart MySQL
#   • the DB user must be allowed from a non-local host, e.g.
#       CREATE USER 'nepse'@'%' IDENTIFIED BY '...';
#       GRANT ALL ON nepse_database.* TO 'nepse'@'%'; FLUSH PRIVILEGES;
#   • Windows Firewall must allow inbound TCP on the MySQL port

services:
  web:
    build: .
    env_file:
      - .env
    environment:
      # Reach the host's MySQL from inside the container. Set DB_HOST_DOCKER in
      # .env to override (e.g. a LAN IP, or another machine's address).
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
    extra_hosts:
      # Needed on Linux; harmless on Docker Desktop for Windows/macOS.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped
